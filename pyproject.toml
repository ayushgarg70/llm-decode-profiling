[project]
name = "decode-profiling"
version = "0.1.0"
description = "Where does decode time go? Profiling a 7B model token by token on one H100."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "pandas",
    "matplotlib",
    "torchao>=0.18.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
